<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern News Channel Ticker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Teko:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Base page styling to look like a dark news studio */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
        }

        /* Ambient studio lights in the background */
        .studio-lights {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(220, 20, 60, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(0, 119, 255, 0.15) 0%, transparent 40%);
            z-index: 1;
        }

        /* Main Ticker Container */
        .ticker-wrapper {
            position: absolute;
            bottom: 15%; /* Elevated slightly to show reflection below */
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 10;
            display: flex;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.7);
        }

        /* Glossy Background */
        .ticker-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #001f3f 0%, #7c0a02 50%, #001f3f 100%);
            background-size: 200% 100%;
            animation: panBg 15s ease-in-out infinite alternate;
            border-top: 3px solid #FFD700;
            border-bottom: 3px solid #FFD700;
            box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.2);
        }

        /* The Glass/Gloss Reflection on the Ticker Bar */
        .ticker-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }

        @keyframes panBg {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Breaking News Badge */
        .flash-badge {
            position: relative;
            z-index: 2;
            background: linear-gradient(to bottom, #ff1a1a, #990000);
            color: #FFD700;
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            line-height: 1;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 4px solid #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
            min-width: 200px;
        }

        /* Pulsing dot for "LIVE" feel */
        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: #FFD700;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        /* Text Container */
        .headline-container {
            position: relative;
            z-index: 2;
            flex-grow: 1;
            display: flex;
            align-items: center;
            padding-left: 30px;
            overflow: visible; /* Important: Allows reflection to spill out */
            perspective: 1000px;
        }

        /* Headline Text & Reflection */
        .headline-text {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.9), 0px 0px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
            letter-spacing: 1px;
            /* Webkit Box Reflect creates the classic floor reflection */
            -webkit-box-reflect: below -4px linear-gradient(transparent 40%, rgba(255,255,255,0.4));
            transform-origin: left center;
            position: absolute;
            will-change: transform, opacity;
        }

        /* --- Custom Animations --- */

        /* Enter Animation: Scales up from small, fades in */
        @keyframes scaleIn {
            0% {
                transform: scale(0.6) translateZ(-100px);
                opacity: 0;
                filter: blur(4px);
            }
            100% {
                transform: scale(1) translateZ(0);
                opacity: 1;
                filter: blur(0px);
            }
        }

        /* Exit Animation: Scales up to massive, fades out (enlarging pop effect) */
        @keyframes scaleOut {
            0% {
                transform: scale(1) translateZ(0);
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: scale(1.5) translateZ(100px);
                opacity: 0;
                filter: blur(8px);
            }
        }

        .anim-in {
            animation: scaleIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .anim-out {
            animation: scaleOut 0.6s cubic-bezier(0.8, 0, 0.8, 0.2) forwards;
        }

        /* Scrolling background stripes for active movement */
        .stripes {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 20px,
                rgba(0, 0, 0, 0.1) 20px,
                rgba(0, 0, 0, 0.1) 40px
            );
            background-size: 200% 200%;
            animation: moveStripes 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: -100% 0; }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .flash-badge {
                font-size: 1.8rem;
                padding: 0 15px;
                min-width: 120px;
            }
            .headline-text {
                font-size: 1.5rem;
                -webkit-box-reflect: below -2px linear-gradient(transparent 40%, rgba(255,255,255,0.4));
            }
            .ticker-wrapper {
                height: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="studio-lights"></div>

    <div class="ticker-wrapper">
        <!-- Glossy Background Layer -->
        <div class="ticker-bg">
            <div class="stripes"></div>
        </div>

        <!-- Static Badge -->
        <div class="flash-badge">
            <div class="pulse-dot"></div>
            FLASH NEWS
        </div>

        <!-- Dynamic Headline Area -->
        <div class="headline-container">
            <div id="headline" class="headline-text anim-in">
                WAITING FOR LIVE UPDATES...
            </div>
        </div>
    </div>

    <script>
        // Array of dummy headlines matching regional/classical news channel vibes
        const headlines = [
            "THIRUVANANTHAPURAM: RED ALERT ISSUED FOR 5 DISTRICTS DUE TO HEAVY RAIN",
            "STATE CABINET APPROVES MASSIVE FUNDING FOR NEW INFRASTRUCTURE PROJECTS",
            "GOLD PRICES REACH HISTORIC ALL-TIME HIGH IN LOCAL MARKETS THIS WEEK",
            "SPORTS: KERALA BLASTERS SECURE THRILLING LAST-MINUTE VICTORY IN ISL",
            "TECH HUB: GLOBAL IT GIANTS ANNOUNCE MAJOR EXPANSION IN KOCHI INFO PARK"
        ];

        let currentIndex = 0;
        const headlineElement = document.getElementById('headline');

        // Initial setup
        headlineElement.innerText = headlines[currentIndex];

        function swapHeadline() {
            // 1. Trigger the "Enlarging/Fading Out" animation
            headlineElement.classList.remove('anim-in');
            headlineElement.classList.add('anim-out');

            // 2. Wait for the exit animation to finish, then swap text and trigger entry
            setTimeout(() => {
                // Update index
                currentIndex = (currentIndex + 1) % headlines.length;
                
                // Swap Text
                headlineElement.innerText = headlines[currentIndex];
                
                // Remove exit class, add entry class (scale up from small)
                headlineElement.classList.remove('anim-out');
                headlineElement.classList.add('anim-in');
            }, 600); // 600ms matches the duration of scaleOut animation in CSS
        }

        // Swap headline every 4.5 seconds
        setInterval(swapHeadline, 4500);

    </script>
</body>
</html>
